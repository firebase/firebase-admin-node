version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # Keep ESLint and typescript-eslint packages in lockstep
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
      # Batch Firebase sibling packages together
      firebase:
        patterns:
          - "@firebase/*"
      # Batch all non-breaking devDependencies into a single weekly PR
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # Batch non-breaking prod/optional dependencies into a single PR
      prod-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  # Automatically update SHA-pinned GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
